[flake8]
max-line-length = 79
max-complexity = 10
ignore =
    W503,
    F811,
    D100, D101, D102, D103, D104, D105, D106, D107,
    D203, D205, D213,
    D400, D401,
    N806, N818
exclude =
    .git,
    __pycache__,
    */migrations/,
    venv/,
    env/,
    manage.py,
    .venv/
    settings.py
per-file-ignores =
    anfisa_for_friends/settings.py:E501

[isort]
profile = black
line_length = 79
skip =
    venv,
    .venv,
    migrations,
    __pycache__